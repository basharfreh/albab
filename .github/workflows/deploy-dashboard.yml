name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/albab_core/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      # albab_core's User/Listing/etc. models are @freezed + json_serializable — their
      # .freezed.dart/.g.dart files are gitignored (never committed) and only ever existed on
      # dev machines that had already run build_runner locally. A fresh CI checkout has none
      # of them, so apps/dashboard fails to compile against "empty" model classes (confirmed:
      # "The getter 'role' isn't defined for the type 'User'") unless generated here first.
      - name: Generate code (albab_core)
        working-directory: packages/albab_core
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install dependencies
        working-directory: apps/dashboard
        run: flutter pub get

      - name: Build web
        working-directory: apps/dashboard
        # API_BASE_URL comes from a repo variable (Settings -> Secrets and variables ->
        # Actions -> Variables) set once the backend's real hosted URL is known — falls back
        # to localhost so the build never fails outright before that's configured, though the
        # deployed dashboard won't be able to reach a backend until it's set for real.
        run: |
          flutter build web --release \
            --base-href /${{ github.event.repository.name }}/ \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://localhost:8000/api/v1' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
